query Cases(
  $limit: Int!
  $offset: Int!
  $fromDate: DateTime
  $throughDate: DateTime
  $incidentFromDate: Date
  $incidentThroughDate: Date
  $authorities: [ID]
  $reportTypes: [UUID]
  $includeChildAuthorities: Boolean
  $q: String
  $caseStatuses: String
) {
  casesQuery(
    report_CreatedAt_Gte: $fromDate
    report_CreatedAt_Lte: $throughDate
    report_IncidentDate_Gte: $incidentFromDate
    report_IncidentDate_Lte: $incidentThroughDate
    report_RelevantAuthorities_Id_In: $authorities
    report_ReportType_Id_In: $reportTypes
    includeChildAuthorities: $includeChildAuthorities
    q: $q
    caseStatuses: $caseStatuses
    limit: $limit
    offset: $offset
  ) {
    totalCount
    results {
      id
      isFinished
      statusLabel
      closeOutcome
      closeSource
      report {
        createdAt
        incidentDate
        rendererData
        reportType {
          id
          name
        }
        reportedBy {
          username
          firstName
          lastName
          telephone
        }
        authorities {
          name
        }
        currentRiskAssessment {
          ...RiskAssessmentFields
        }
      }
    }
  }
}

query GetCase($id: UUID!) {
  caseGet(id: $id) {
    id
    description
    isFinished
    statusLabel
    threadId
    outbreakPlanInfo
    aiSuspected
    testResult
    stoppedAt
    closeSource
    closeOutcome
    closePayload
    closedBy {
      id
      firstName
      lastName
      username
    }
    authorities {
      id
      name
    }
    report {
      id
      createdAt
      incidentDate
      gpsLocation
      updatedAt
      rendererData
      data
      aiSuspected
      reportType {
        id
        name
        definition
        closeDefinition
      }
      platform
      coverImage {
        id
        file
        thumbnail
      }
      images {
        id
        file
        thumbnail
        imageUrl
      }
      uploadFiles {
        id
        file
        fileType
        fileUrl
      }
      reportedBy {
        firstName
        lastName
        id
        telephone
      }
      authorities {
        name
      }
      village {
        id
        name
        code
      }
      currentRiskAssessment {
        ...RiskAssessmentFields
      }
      riskAssessmentHistory(limit: 3) {
        ...RiskAssessmentFields
      }
    }
    stateDefinition {
      id
      name
      isDefault
      statestepSet {
        id
        name
        isStartState
        isStopState
        toTransitions {
          id
          fromStep {
            id
            name
            isStartState
            isStopState
          }
          toStep {
            id
            name
            isStartState
            isStopState
          }
          formDefinition
        }
      }
    }
    states {
      id
      state {
        id
        name
        isStartState
        isStopState
        toTransitions {
          id
          fromStep {
            id
            name
            isStartState
            isStopState
          }
          toStep {
            id
            name
            isStartState
            isStopState
          }
          formDefinition
        }
      }
      transition {
        id
        createdAt
        formData
        createdBy {
          id
          firstName
          lastName
        }
        transition {
          id
          fromStep {
            id
            name
            isStartState
            isStopState
          }
          toStep {
            id
            name
            isStartState
            isStopState
          }
          formDefinition
        }
      }
    }
  }
}

mutation StateForward(
  $caseId: ID!
  $transitionId: ID!
  $formData: GenericScalar
) {
  forwardState(
    caseId: $caseId
    transitionId: $transitionId
    formData: $formData
  ) {
    result {
      id
      state {
        id
        name
        isStartState
        isStopState
        toTransitions {
          id
          fromStep {
            id
            name
            isStartState
            isStopState
          }
          toStep {
            id
            name
            isStartState
            isStopState
          }
          formDefinition
        }
      }
    }
  }
}

mutation UpdateCaseTestResult($caseId: UUID!, $testResult: String!) {
  adminCaseTestResultUpdate(caseId: $caseId, testResult: $testResult) {
    result {
      id
      testResult
      aiSuspected
      closePayload
    }
  }
}

mutation CloseCase($caseId: UUID!, $payload: GenericScalar, $outcome: String) {
  adminCaseClose(caseId: $caseId, payload: $payload, outcome: $outcome) {
    result {
      id
      isFinished
      statusLabel
      testResult
      aiSuspected
      stoppedAt
      closeSource
      closeOutcome
      closePayload
      closedBy {
        id
        firstName
        lastName
        username
      }
    }
  }
}

mutation CompleteAfterAutoClose($caseId: UUID!, $payload: GenericScalar) {
  adminCaseCompleteAfterAutoClose(caseId: $caseId, payload: $payload) {
    result {
      id
      isFinished
      statusLabel
      testResult
      aiSuspected
      stoppedAt
      closeSource
      closeOutcome
      closePayload
      closedBy {
        id
        firstName
        lastName
        username
      }
    }
  }
}

mutation UpdateFinishedCloseData($caseId: UUID!, $payload: GenericScalar) {
  adminCaseCloseDataUpdate(caseId: $caseId, payload: $payload) {
    result {
      id
      isFinished
      statusLabel
      testResult
      aiSuspected
      stoppedAt
      closeSource
      closeOutcome
      closePayload
      closedBy {
        id
        firstName
        lastName
        username
      }
    }
  }
}
